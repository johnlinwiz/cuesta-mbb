name: daily reminders

on:
  schedule:
    - cron: "0 15 * * *"   # 8:00 AM PDT / 7:00 AM PST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/schedule.yaml", "data/venues.yaml", "scripts/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        # Parsers/generators must pass against last season's saved pages before this job
        # fetches anything, comments on issues, or commits to the Pages site.
        run: python -m pytest tests/unit -q
      - name: Sync issues (on schedule edits)
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/sync_issues.py
      - name: Fetch final scores from the official schedule page
        continue-on-error: true
        run: python scripts/fetch_results.py
      - name: Check official schedule feed for changes
        # Opens/updates one `schedule-drift` issue (with @mention) when the 3C2A feed
        # disagrees with data/schedule.yaml; closes it when they agree again.
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/check_feed.py --issue
      - name: Post reminders / close finished games
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python scripts/daily.py
      - name: Rebuild docs
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md CALENDAR.md venues.geojson docs data/issues.json data/results.json
          git diff --cached --quiet || { git commit -m "chore: daily schedule refresh"; git push; }
